name: jp-final-visual-uat-artifact

# Packages sanitized visual UAT screenshots as a downloadable Actions artifact
# for ChatGPT/GitHub connector review (PNG binaries are not multimodal via git API).

on:
  push:
    branches:
      - evidence/jp-final-visual-uat-20260917
    paths:
      - "docs/evidence/jp-final-visual-uat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage artifact payload (preserve nested paths; exclude archives)
        run: |
          set -euo pipefail
          ROOT="docs/evidence/jp-final-visual-uat"
          mkdir -p artifact/screenshots
          # Manifests / status (active only)
          for f in \
            manifest.md manifest-live.md manifest-live.json \
            manifest-group-payment-live.json manifest-portals-live.json \
            manifest-golden-flights-live.json \
            manifest-functional-regression.json manifest-logo-favicon-matrix.json \
            STATUS.md STATUS-CORRECTION-08.md DEPLOY-STAMP-675c7e5e.txt \
            artifact-integrity.json
          do
            if [ -f "$ROOT/$f" ]; then
              cp "$ROOT/$f" "artifact/$f"
            fi
          done

          # Active screenshot trees only — never flatten with basename.
          # Explicitly exclude archive-* so rejected bytes cannot overwrite live/.
          if [ -d "$ROOT/live" ]; then
            mkdir -p artifact/screenshots/live
            find "$ROOT/live" -mindepth 1 -maxdepth 1 ! -name 'archive-*' -exec \
              cp -R {} artifact/screenshots/live/ \;
          fi

          # Historical stamps / rejected packs under non-active prefix only
          mkdir -p artifact/archive
          if [ -d "$ROOT/archive-rejected-44823f1" ]; then
            cp -R "$ROOT/archive-rejected-44823f1" artifact/archive/ || true
          fi
          if [ -d "$ROOT/archive-historical" ]; then
            cp -R "$ROOT/archive-historical" artifact/archive/ || true
          fi
          # Never stage old 27a stamp as active
          if [ -f "$ROOT/DEPLOY-STAMP-27a1ed9f.txt" ]; then
            mkdir -p artifact/archive/archive-historical
            cp "$ROOT/DEPLOY-STAMP-27a1ed9f.txt" artifact/archive/archive-historical/ || true
          fi

          echo "STAGED_FILE_COUNT=$(find artifact -type f | wc -l)"
          echo "ACTIVE_LIVE_PNG=$(find artifact/screenshots/live -type f -name '*.png' 2>/dev/null | wc -l || echo 0)"
          if find artifact/screenshots -type d -name 'archive-rejected-*' | grep -q .; then
            echo "FAIL: archive-rejected leaked into screenshots/"
            exit 1
          fi
          if [ -f artifact/DEPLOY-STAMP-27a1ed9f.txt ]; then
            echo "FAIL: stale DEPLOY-STAMP-27a1ed9f staged as active"
            exit 1
          fi

      - name: Verify artifact integrity against active manifests
        run: |
          set -euo pipefail
          python3 docs/evidence/jp-final-visual-uat/scripts/verify-artifact-integrity.py \
            --evidence-root docs/evidence/jp-final-visual-uat \
            --artifact-root artifact \
            --out artifact/artifact-integrity.json
          cp artifact/artifact-integrity.json docs/evidence/jp-final-visual-uat/artifact-integrity.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifact/artifact-integrity.json").read_text())
          assert d.get("ARTIFACT_INTEGRITY")=="PASS", d
          assert int(d.get("HASH_MISMATCH", 1))==0, d
          assert int(d.get("SOURCE_FILE_MISSING", 1))==0, d
          assert int(d.get("ARTIFACT_FILE_MISSING", 1))==0, d
          assert int(d.get("ARCHIVE_OVERLAP", 1))==0, d
          assert int(d.get("ACTIVE_RELEASE_SHA_MISMATCH", 1))==0, d
          assert int(d.get("ACTIVE_PUBLIC_BUILD_MISMATCH", 1))==0, d
          assert int(d.get("ACTIVE_DASHBOARD_BUILD_MISMATCH", 1))==0, d
          assert int(d.get("STALE_TOKEN_HITS", 1))==0, d
          print(
            "ARTIFACT_INTEGRITY=PASS",
            f"ACTIVE_MANIFEST_ROWS={d.get('ACTIVE_MANIFEST_ROWS')}",
            f"UNIQUE_ACTIVE_SCREENSHOTS={d.get('UNIQUE_ACTIVE_SCREENSHOTS')}",
          )
          PY

      - name: Upload jp-final-visual-uat artifact
        uses: actions/upload-artifact@v4
        with:
          name: jp-final-visual-uat
          path: artifact/
          if-no-files-found: error
          retention-days: 30
