name: JetPakistan release guards

on:
  push:
    branches: [main, "perf/**", "claude/**"]
  pull_request:
    branches: [main]

jobs:
  release-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: none

      - name: Retired nested homepage duplicate must stay gone
        run: |
          if [ -d "docs/closure/01-homepage/docs/closure/01-homepage" ]; then
            echo "RETIRED_PATH_PRESENT=FAIL"
            exit 1
          fi
          echo "RETIRED_PATH_GUARD=PASS"

      - name: Release lock provenance semantics (v2)
        run: |
          test -f docs/closure/jetpakistan-release-lock.json
          test -f docs/JETPAKISTAN_RELEASE_GUARD_POLICY.md
          test -f docs/closure/JETPAKISTAN_CANONICAL_RELEASE.md
          test -f docs/closure/JETPAKISTAN_RETIREMENT_INVENTORY.md
          test -f deploy/openlitespeed/jetpakistan-vhost-routes.conf
          test -f scripts/jp-ols-assert-flights-short-url.sh
          php -r '
            $lock = json_decode(file_get_contents("docs/closure/jetpakistan-release-lock.json"), true);
            if (!is_array($lock)) { fwrite(STDERR, "LOCK_JSON_INVALID\n"); exit(1); }
            $app = $lock["application_release_sha"] ?? null;
            if (!$app || !preg_match("/^[0-9a-f]{40}$/", $app)) {
              fwrite(STDERR, "APPLICATION_RELEASE_SHA_INVALID\n");
              exit(1);
            }
            $required = [
              "production_runtime_sha",
              "public_build_source_sha",
              "dashboard_build_source_sha",
              "public_build_id",
              "dashboard_build_id",
              "runtime_marker",
              "rollback_sha",
            ];
            foreach ($required as $k) {
              if (empty($lock[$k])) { fwrite(STDERR, "LOCK_MISSING_$k\n"); exit(1); }
            }
            foreach (["production_runtime_sha","public_build_source_sha","dashboard_build_source_sha"] as $k) {
              if (($lock[$k] ?? null) !== $app) {
                fwrite(STDERR, "BUILD_PROVENANCE_MISMATCH field=$k got={$lock[$k]} want=$app\n");
                exit(1);
              }
            }
            // Metadata tip may follow application release; never require HEAD==app or HEAD~1 hacks.
            $meta = $lock["closure_metadata_commit_sha"] ?? null;
            if ($meta !== null && $meta !== "" && !preg_match("/^[0-9a-f]{40}$/", $meta)) {
              fwrite(STDERR, "CLOSURE_METADATA_SHA_INVALID\n");
              exit(1);
            }
            if (($lock["critical_route_owners"]["/flights/s/{ref}"] ?? null) !== "NEXT") {
              fwrite(STDERR, "SHORT_OWNER_FAIL\n");
              exit(1);
            }
            if (($lock["ols_configuration_source"] ?? null) !== "deploy/openlitespeed/jetpakistan-vhost-routes.conf") {
              fwrite(STDERR, "OLS_SOURCE_FAIL\n");
              exit(1);
            }
            $manifest = file_get_contents("docs/closure/JETPAKISTAN_CANONICAL_RELEASE.md");
            if (strpos($manifest, $app) === false) {
              fwrite(STDERR, "MANIFEST_MISSING_APPLICATION_RELEASE_SHA\n");
              exit(1);
            }
            if (strpos($manifest, "1fc2dad1386d417d128473891afbc47c0ba330a8") !== false && strpos($manifest, "application_release_sha") === false) {
              fwrite(STDERR, "MANIFEST_STALE_1fc2dad1_AS_FINAL\n");
              exit(1);
            }
            echo "APPLICATION_RELEASE_SHA=$app\n";
            echo "RELEASE_LOCK_SEMANTICS=PASS\n";
            echo "BUILD_PROVENANCE_LOCK=PASS\n";
          '
          echo "RELEASE_ARTIFACTS=PASS"

      - name: OLS vhost routes exact short-URL rule
        run: |
          php -r '
            $conf = file_get_contents("deploy/openlitespeed/jetpakistan-vhost-routes.conf");
            $need = [
              "RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$",
              "RewriteRule ^/flights/s/([A-Za-z0-9]{8,32})$ http://jetpk_public_next/flights/s/\$1 [P,L,E=PROXY-HOST:jetpakistan.pk]",
              "RewriteRule ^/groups$ http://jetpk_public_next/groups [P,L,E=PROXY-HOST:jetpakistan.pk]",
            ];
            foreach ($need as $n) {
              if (strpos($conf, $n) === false) { fwrite(STDERR, "MISSING: $n\n"); exit(1); }
            }
            echo "OLS_SNIPPET_GUARD=PASS\n";
          '

      - name: PII / serialized state URL pattern scan (static)
        run: |
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.next \
            'search_id=[^&[:space:]]+|passport=|phone=' frontend/app frontend/features 2>/dev/null; then
            echo "PII_URL_PATTERN=FAIL"
            exit 1
          fi
          echo "PII_URL_PATTERN_SCAN=PASS"

      - name: Short URL path convention
        run: |
          grep -RIn "flights/s/" frontend docs/jetpk deploy/openlitespeed scripts/jp-ols-assert-flights-short-url.sh >/dev/null
          echo "SHORT_URL_REFERENCES=PASS"

      - name: Optional PHPUnit when vendor present
        run: |
          if [ -d vendor/bin ]; then
            php vendor/bin/phpunit --filter "OlsFlightsShortUrlSnippetTest|PublicUrlSensitivityGuardTest"
          else
            echo "PHPUNIT_SKIPPED_NO_VENDOR=PASS"
          fi
