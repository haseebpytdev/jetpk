# Canonical Public Next flight UI routes — jetpakistan.pk OLS rewrite block
#
# Authority: deploy/openlitespeed/ (tracked). Production applies via
# scripts/jp-ols-assert-flights-short-url.sh / documented runbook.
# Secrets must never live in this file.
#
# Ordering: these rules must appear in the vhost `rewrite { }` block BEFORE
# requests fall through to Laravel docroot/index.php. Exact GET/HEAD only —
# POST/mutations stay Laravel.
#
# Proxy handler: extprocessor jetpk_public_next → 127.0.0.1:3010
# PROXY-HOST must be jetpakistan.pk for correct Host/RSC behavior.

    # Flight UI shells (exact page paths — not /flights/results/data etc.).
    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    RewriteRule ^/flights/(fare-selection|results|return-options)$ http://jetpk_public_next/flights/$1 [P,L,E=PROXY-HOST:jetpakistan.pk]

    # Opaque Class B short search URL — same results shell; keep visible path.
    # MUST stay after the exact results rule; MUST NOT be absorbed by Laravel CMS catch-all.
    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    RewriteRule ^/flights/s/([A-Za-z0-9]{8,32})$ http://jetpk_public_next/flights/s/$1 [P,L,E=PROXY-HOST:jetpakistan.pk]

    # Group landing (exact). /groups/search and /groups/{id} are separate rules in the live vhost.
    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    RewriteRule ^/groups$ http://jetpk_public_next/groups [P,L,E=PROXY-HOST:jetpakistan.pk]
