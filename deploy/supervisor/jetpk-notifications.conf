; JetPakistan notification workers (Supervisor).
; One process consumes all notification queues in priority order.
; Do not over-provision on the shared LiteSpeed host.

[program:jetpk-notifications]
process_name=%(program_name)s
command=/usr/local/lsws/lsphp83/bin/lsphp /home/pkjetp/jetpk_app/artisan queue:work database --queue=notifications-critical,notifications-transactional,notifications-ops,notifications-bulk --sleep=1 --tries=5 --timeout=90 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=pkjetp
numprocs=1
redirect_stderr=true
stdout_logfile=/home/pkjetp/jetpk_app/storage/logs/notification-worker.log
stopwaitsecs=70
